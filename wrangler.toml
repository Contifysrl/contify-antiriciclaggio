name = "contify-antiriciclaggio"
main = "worker/src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Il Worker gira PRIMA del livello degli asset (AR-M23b). Senza questa riga,
# in produzione una navigazione del browser (Sec-Fetch-Mode: navigate) verso
# un percorso che non è un file — quindi anche /api/documenti/:id aperto con
# un link o in una nuova scheda — riceveva index.html dal fallback SPA senza
# mai arrivare al Worker: «i documenti non si aprono» (Barbara, 30.9.2026).
# Le fetch/XHR verso /api non erano toccate, per questo le prove sulle API
# passavano; wrangler dev in locale non replica il comportamento. Con il
# Worker davanti a tutto, gli asset passano dal catch-all in fondo a
# index.ts (env.ASSETS.fetch) e anche l'HTML esce con le intestazioni di
# sicurezza (CSP, HSTS) che prima valevano solo per le risposte delle API.
run_worker_first = true

# D1: dati di dominio. Regione EU (WEUR) — i dati trattati sono dati personali
# di clienti dello studio, inclusi dati relativi a condanne penali e reati
# quando emergono in sede di adeguata verifica (art. 10 GDPR).
[[d1_databases]]
binding = "DB"
database_name = "contify-antiriciclaggio"
database_id = "7b64cd42-23fd-4378-8b1f-f544463b43ab" # creato il 29.7.2026, regione WEUR, schema 0001 applicato

# R2: documenti del fascicolo e backup. Jurisdiction EU obbligatoria (dati
# AML, possibili dati ex art. 10 GDPR). Creare i bucket con:
#   wrangler r2 bucket create contify-antiriciclaggio-docs -J eu
#   wrangler r2 bucket create contify-antiriciclaggio-backups -J eu
[[r2_buckets]]
binding = "DOCS"
bucket_name = "contify-antiriciclaggio-docs"
jurisdiction = "eu"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "contify-antiriciclaggio-backups"
jurisdiction = "eu"

[vars]
AMBIENTE = "produzione" # in locale e' scavalcato da .dev.vars
MAIL_FROM = "Contify AR <no-reply@contify.it>"
APP_BASE_URL = "https://antiriciclaggio.contify.it"
ASSISTENZA_EMAIL = "info@contify.it" # destinatario delle richieste di assistenza in-app
AI_MODEL = "claude-sonnet-4-5" # modello dell'assistente AI; la chiave e' il secret ANTHROPIC_API_KEY

# Dominio di produzione: contify.it è già una zona Cloudflare, quindi il
# custom domain si crea da solo al deploy (DNS e certificato inclusi).
# Resta attivo anche https://contify-antiriciclaggio.contify.workers.dev.
routes = [
  { pattern = "antiriciclaggio.contify.it", custom_domain = true }
]

# Backup notturno + calcolo dello scadenzario.
[triggers]
crons = ["0 2 * * *"]

# Secret da impostare con `wrangler secret put`:
#   MASTER_KEY      chiave base64 a 32 byte per la cifratura delle SOS e dei dati identificativi
#   RESEND_API_KEY  invio email (notifiche di scadenza)
